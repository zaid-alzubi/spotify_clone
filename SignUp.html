
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">

        <!-- Spotify Logo -->
        <div class="spotify-logo">
            <svg viewBox="0 0 24 24" aria-label="Spotify logo" role="img">
                <circle cx="12" cy="12" r="10.5"/>
                <path d="M5.5 9.2C9.8 7.9 14.8 8.6 18.2 10.5"/>
                <path d="M6.5 12.1C10 11.1 14 11.7 17 13.3"/>
                <path d="M7.5 14.9C10.3 14.2 13.3 14.7 15.8 16"/>
            </svg>
        </div>

        <h1>Millions of songs.<br>Free on Spotify.</h1>

        <div class="signup-options">

            <!-- Sign Up Free -->
            <a href="#" class="btn btn-primary">
                Sign up free
            </a>

            <!-- Phone Number -->
            <a href="#" class="btn btn-outline">
                <svg class="social-icon phone-svg" viewBox="0 0 24 24">
                    <rect x="7" y="2" width="10" height="20" rx="2"/>
                    <line x1="10" y1="18" x2="14" y2="18"/>
                </svg>
                <span>Continue with phone number</span>
            </a>

            <!-- Google -->
            <a href="#" class="btn btn-outline">
                <svg class="social-icon" viewBox="0 0 48 48">
                    <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"/>
                    <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3C9.2 39.6 16 44 24 44z"/>
                    <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8z"/>
                    <path fill="#EA4335" d="M24 12.1c3 0 5.6 1 7.7 3.1l5.8-5.8C34 5.9 29.5 4 24 4 16 4 9.2 8.4 5.8 15.1l6.8 5.3c1.6-4.8 6.1-8.3 11.4-8.3z"/>
                </svg>
                <span>Continue with Google</span>
            </a>

            <!-- Facebook -->
            <a href="#" class="btn btn-outline">
                <svg class="social-icon facebook-svg" viewBox="0 0 24 24">
                    <path fill="#1877F2" d="M24 12a12 12 0 1 0-13.875 11.85v-8.38H7.08V12h3.045V9.356c0-3.006 1.792-4.667 4.533-4.667 1.312 0 2.685.234 2.685.234v2.953h-1.513c-1.49 0-1.955.925-1.955 1.875V12h3.328l-.532 3.47h-2.796v8.38A12 12 0 0 0 24 12z"/>
                    <path fill="#FFFFFF" d="M16.671 15.47l.532-3.47h-3.328V9.751c0-.95.465-1.875 1.955-1.875h1.513V4.923s-1.373-.234-2.685-.234c-2.741 0-4.533 1.661-4.533 4.667V12H7.08v3.47h3.045v8.38a12.1 12.1 0 0 0 3.75 0v-8.38z"/>
                </svg>
                <span>Continue with Facebook</span>
            </a>

        </div>

        <!-- Login Link -->
        <p class="switch-page">
            <a href="login.html">Log in</a>
        </p>

    </main>

</body>
</html>
